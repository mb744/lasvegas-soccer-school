name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # required for Azure OIDC login

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=${GITHUB_SHA::7}
          REF="${{ env.REGISTRY }}/${OWNER_LOWER}/${REPO_LOWER}:sha-${SHA_SHORT}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Image: ${REF}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Make package public
        # Container Apps pulls anonymously when the package is public.
        # The first push creates the package as private; flip to public.
        # Idempotent — safe to run on every deploy.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          # Best-effort; if it fails (already public, or perms issue) we continue.
          gh api -X PATCH "/user/packages/container/${REPO_LOWER}/visibility" -f visibility=public 2>&1 \
            || gh api -X PATCH "/orgs/${OWNER_LOWER}/packages/container/${REPO_LOWER}/visibility" -f visibility=public 2>&1 \
            || echo "Could not flip visibility automatically — set it manually in GitHub UI if needed."

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >
            containerImage=${{ needs.build-and-push.outputs.image }}
            sqlAadAdminObjectId=${{ vars.SQL_AAD_ADMIN_OBJECT_ID }}
            sqlAadAdminLogin=${{ vars.SQL_AAD_ADMIN_LOGIN }}
            activeSeason=${{ vars.ACTIVE_SEASON || '2026/27' }}
            customDomain=${{ vars.CUSTOM_DOMAIN }}
            apexDomain=${{ vars.APEX_DOMAIN }}
            adminBootstrapEmail=${{ vars.ADMIN_BOOTSTRAP_EMAIL }}
            adminBootstrapPassword=${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
            googleOAuthClientId=${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
            googleOAuthClientSecret=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
            facebookOAuthAppId=${{ vars.FACEBOOK_OAUTH_APP_ID }}
            facebookOAuthAppSecret=${{ secrets.FACEBOOK_OAUTH_APP_SECRET }}
            enableAcs=${{ vars.ENABLE_ACS || 'false' }}
            acsSmsFromNumber=${{ vars.ACS_SMS_FROM_NUMBER }}
            acsCustomEmailDomain=${{ vars.ACS_CUSTOM_EMAIL_DOMAIN }}
            acsCustomEmailLocalPart=${{ vars.ACS_CUSTOM_EMAIL_LOCAL_PART || 'registration' }}
            twilioAccountSid=${{ vars.TWILIO_ACCOUNT_SID }}
            twilioAuthToken=${{ secrets.TWILIO_AUTH_TOKEN }}
            twilioSmsFromNumber=${{ vars.TWILIO_SMS_FROM_NUMBER }}
            twilioWhatsAppFromNumber=${{ vars.TWILIO_WHATSAPP_FROM_NUMBER }}
            twilioWhatsAppTemplateSid=${{ vars.TWILIO_WHATSAPP_TEMPLATE_SID }}
            twilioConversationsServiceSid=${{ vars.TWILIO_CONVERSATIONS_SERVICE_SID }}
          deploymentName: lvss-${{ github.run_id }}
          failOnStdErr: false

      - name: Show deployment outputs
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          DEP: lvss-${{ github.run_id }}
        run: |
          set -e
          OUTPUTS=$(az deployment group show -g "$RG" -n "$DEP" --query properties.outputs -o json)
          APP_URL=$(echo "$OUTPUTS" | jq -r '.appUrl.value // empty')
          PUBLIC_URL=$(echo "$OUTPUTS" | jq -r '.publicBaseUrl.value // empty')
          DEFAULT_FQDN=$(echo "$OUTPUTS" | jq -r '.defaultFqdn.value // empty')
          SQL_FQDN=$(echo "$OUTPUTS" | jq -r '.sqlServerFqdn.value // empty')
          MI_CLIENT=$(echo "$OUTPUTS" | jq -r '.managedIdentityClientId.value // empty')
          GOOGLE_REDIRECT=$(echo "$OUTPUTS" | jq -r '.googleRedirectUri.value // empty')
          FACEBOOK_REDIRECT=$(echo "$OUTPUTS" | jq -r '.facebookRedirectUri.value // empty')
          VERIFY_ID=$(echo "$OUTPUTS" | jq -r '.customDomainVerificationId.value // empty')
          echo "::notice title=App URL::$APP_URL"
          echo "Container App default FQDN: $DEFAULT_FQDN"
          echo "Public base URL (used for outreach links): $PUBLIC_URL"
          echo "SQL FQDN: $SQL_FQDN"
          echo "Managed Identity Client ID: $MI_CLIENT"
          echo "Google redirect URI: $GOOGLE_REDIRECT"
          echo "Facebook redirect URI: $FACEBOOK_REDIRECT"
          echo "Custom Domain Verification ID (for first-time hostname bind): $VERIFY_ID"

      # Bicep can't declare the customDomain binding because cert provisioning needs the
      # hostname registered on the container app first (chicken-and-egg in a single pass).
      # Both `hostname add` and `hostname bind` are idempotent — no-ops when already bound.
      - name: Bind custom domain (idempotent)
        if: vars.CUSTOM_DOMAIN != ''
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: lvss-app
          DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          set -e
          ENV_NAME=$(az containerapp env list -g "$RG" --query "[0].name" -o tsv)
          echo "Environment: $ENV_NAME"
          # `hostname add` is no-op (errors out non-fatally) if hostname already registered.
          az containerapp hostname add  -g "$RG" -n "$APP_NAME" --hostname "$DOMAIN" || echo "hostname add: already registered or transient — continuing"
          # `hostname bind --validation-method CNAME` provisions a managed cert if none
          # exists for this hostname yet, otherwise re-binds the existing one.
          az containerapp hostname bind -g "$RG" -n "$APP_NAME" --hostname "$DOMAIN" --environment "$ENV_NAME" --validation-method CNAME
          az containerapp hostname list -g "$RG" -n "$APP_NAME" -o table

      # Apex hostname binding. Same pattern as customDomain but uses --validation-method TXT
      # because the apex can't have a CNAME at the zone root (RFC). Requires an A record at the
      # apex pointing to the Container App env's static IP, plus an asuid.<apex> TXT record with
      # the customDomainVerificationId for the cert provisioning challenge.
      - name: Bind apex domain (idempotent)
        if: vars.APEX_DOMAIN != ''
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: lvss-app
          APEX: ${{ vars.APEX_DOMAIN }}
        run: |
          set -e
          ENV_NAME=$(az containerapp env list -g "$RG" --query "[0].name" -o tsv)
          echo "Environment: $ENV_NAME"
          az containerapp hostname add  -g "$RG" -n "$APP_NAME" --hostname "$APEX" || echo "hostname add: already registered or transient — continuing"
          az containerapp hostname bind -g "$RG" -n "$APP_NAME" --hostname "$APEX" --environment "$ENV_NAME" --validation-method TXT
          az containerapp hostname list -g "$RG" -n "$APP_NAME" -o table
