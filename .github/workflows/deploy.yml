name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # required for Azure OIDC login

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=${GITHUB_SHA::7}
          REF="${{ env.REGISTRY }}/${OWNER_LOWER}/${REPO_LOWER}:sha-${SHA_SHORT}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Image: ${REF}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Make package public
        # Container Apps pulls anonymously when the package is public.
        # The first push creates the package as private; flip to public.
        # Idempotent — safe to run on every deploy.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          # Best-effort; if it fails (already public, or perms issue) we continue.
          gh api -X PATCH "/user/packages/container/${REPO_LOWER}/visibility" -f visibility=public 2>&1 \
            || gh api -X PATCH "/orgs/${OWNER_LOWER}/packages/container/${REPO_LOWER}/visibility" -f visibility=public 2>&1 \
            || echo "Could not flip visibility automatically — set it manually in GitHub UI if needed."

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >
            containerImage=${{ needs.build-and-push.outputs.image }}
            sqlAadAdminObjectId=${{ vars.SQL_AAD_ADMIN_OBJECT_ID }}
            sqlAadAdminLogin=${{ vars.SQL_AAD_ADMIN_LOGIN }}
          failOnStdErr: false

      - name: Show deployment outputs
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -e
          OUTPUTS=$(az deployment group list \
            --resource-group "$RG" \
            --query "[?properties.provisioningState=='Succeeded'] | [0].properties.outputs" -o json)
          APP_URL=$(echo "$OUTPUTS" | jq -r '.appUrl.value // empty')
          echo "::notice title=App URL::$APP_URL"
          echo "App URL: $APP_URL"
